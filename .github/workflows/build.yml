name: Build

on:
  push:
    branches:
      - 'main'
      - '**hotfix**'
      - '**Hotfix**'
      - '**beta**'
      - '**Beta**'
      - '**dev**'
      - '**Dev**'
    paths:
      - 'src/**'
  pull_request:
    branches:
      - 'main'
      - '**hotfix**'
      - '**Hotfix**'
      - '**beta**'
      - '**Beta**'
      - '**dev**'
      - '**Dev**'
    paths:
      - 'src/**'
      
jobs:
  build-mod:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          9.0.x

    - name: Build
      run: dotnet build src/BetterAmongUs.csproj --configuration Release -p:CopyToGame=false

    - name: Archive DLL file
      uses: actions/upload-artifact@v4
      with:
        name: GreaterAmongUs.dll
        path: src/bin/Release/net6.0/GreaterAmongUs.dll
